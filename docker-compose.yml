services:
  db:
    image: postgres:17
    container_name: access_postgres_service
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"  # можно убрать в будущем
    volumes:
      - pg_data:/var/lib/postgresql/data

  access_management_service:
    build:
      context: ./access_management_service
    container_name: access_management_service
    depends_on:
      - db
    ports:
      - "8001:8000"  # убрать позже
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
    restart: always

  api_gateway:
    build:
      context: ./api_gateway_service
    container_name: api_gateway_service
    depends_on:
      - access_management_service
    ports:
      - "8000:8000"
    env_file:
      - ./api_gateway_service/.env
    environment:
      ACCESS_MANAGEMENT_SERVICE_URL: http://access_management_service:8000
    restart: always

volumes:
  pg_data: